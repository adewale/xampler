name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff
        run: uv run ruff check .

      - name: Pyright library
        run: uv run pyright

      - name: Pyright selected examples
        run: uv run pyright -p pyright.examples.json

      - name: Tests
        run: uv run pytest -q

      - name: ty experimental check
        run: uvx ty check xampler tests --extra-search-path typings --python-version 3.13 --output-format concise

  local-runtime:
    # Realism level 3-4 in docs/api/primitive-test-realism.md: start each example under
    # local `pywrangler dev` (workerd/Miniflare, no Cloudflare credentials) and run the
    # HTTP checks in scripts/verify_examples.py against it.
    name: Local runtime verifier (representative examples)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Point examples at this checkout's xampler
        run: uv run python scripts/use_local_xampler.py

      - name: Verify Worker, R2, KV, D1, and Durable Objects examples
        run: |
          for example in \
            examples/start/hello-worker \
            examples/storage-data/r2-object-storage \
            examples/storage-data/kv-namespace \
            examples/storage-data/d1-database \
            examples/state-events/durable-object-counter; do
            echo "::group::$example"
            # Pay the install cost (uv env, vendored packages, npx wrangler) before
            # the verifier's timed wait for the dev server.
            (cd "$example" && uv run pywrangler dev --help > /dev/null)
            uv run python scripts/verify_examples.py "$example"
            echo "::endgroup::"
          done
