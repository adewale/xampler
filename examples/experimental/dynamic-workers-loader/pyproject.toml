[project]
name = "xampler-experimental-dynamic-workers-loader"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "xampler @ git+https://github.com/adewale/xampler@main",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]

[tool.pywrangler]
# cfboundary and xampler are git dependencies with no prebuilt wheel. Current
# pywrangler installs with --no-build unless this is set, and then fails.
allow-build = true
